apply plugin: "com.android.application"

android {
    namespace packageName
    buildToolsVersion rootProject.ext.buildTools
    compileSdkVersion rootProject.ext.compileSdk

    compileOptions {
        sourceCompatibility rootProject.ext.sourceCompatibilityVersion
        targetCompatibility rootProject.ext.targetCompatibilityVersion
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId packageName
        minSdkVersion rootProject.ext.minSdk
        targetSdkVersion rootProject.ext.targetSdk
        versionCode appVersionCode.toInteger()
        versionName appVersionName
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["src"]
            res.srcDirs = ["res"]
            assets.srcDirs = ["assets", "assets_gen"]
        }

        androidTest {
            java.srcDirs = ["tests-ui/src"]
            res.srcDirs = ["tests-ui/res"]
            assets.srcDirs = ["tests-ui/assets"]
        }

        test {
            java.srcDirs = ["tests-jvm/src"]
        }
    }

    signingConfigs {
        stg_debug {
            keyAlias "stg_debug"
            keyPassword "stg_debug"
            storeFile file("../android-keystore/STG-debug.jks")
            storePassword "stg_debug"
        }
    }

    buildTypes {
        debug {
            versionNameSuffix ".debug"
            signingConfig signingConfigs.stg_debug

            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-project.txt", "../proguard-mobile.txt"
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-project.txt", "../proguard-mobile.txt"
        }
    }

    packaging {
        resources {
            excludes += ["LICENSE.txt"]
        }
    }
}

dependencies {
    /* local dependencies */
    implementation project(':mobile:com.sap.sailing.android.shared')
    /* JVM tests */
    testImplementation "junit:junit:${rootProject.ext.junit}"
    testImplementation "org.mockito:mockito-core:${rootProject.ext.mockito}"
}

/**
 * Copies the built APK into the www apps directory as "<packageName>.apk" and writes a
 * "<packageName>.version" file next to it. Replaces the removed applicationVariants/outputFileName
 * Variant API (AGP 8) with the androidComponents Artifacts API: the task consumes the APK
 * SingleArtifact and resolves the concrete file through the BuiltArtifactsLoader.
 */
abstract class CopyApkToWww extends DefaultTask {
    @InputFiles
    abstract DirectoryProperty getApkDirectory()

    @Internal
    abstract Property<com.android.build.api.variant.BuiltArtifactsLoader> getBuiltArtifactsLoader()

    @Input
    abstract Property<String> getPackageName()

    @Input
    abstract Property<String> getAppVersionCode()

    @Input
    abstract Property<String> getBuildTypeName()

    @OutputDirectory
    abstract DirectoryProperty getDestinationFolder()

    @TaskAction
    void copyApk() {
        final def builtArtifacts = builtArtifactsLoader.get().load(apkDirectory.get())
        final boolean loaded = builtArtifacts != null
        if (loaded) {
            final File destDir = destinationFolder.get().asFile
            destDir.mkdirs()
            final File targetApk = new File(destDir, packageName.get() + ".apk")
            builtArtifacts.elements.each { element ->
                project.copy {
                    from element.outputFile
                    into destDir
                    rename { targetApk.name }
                }
            }
            final File versionFile = new File(destDir, packageName.get() + ".version")
            versionFile.text = packageName.get() + ".apk=" + appVersionCode.get() + "-" + buildTypeName.get()
        } else {
            throw new GradleException("Could not load built APK artifacts from " + apkDirectory.get())
        }
    }
}

androidComponents {
    final String appPackageName = packageName
    final String appVersionCodeValue = appVersionCode
    onVariants(selector().all()) { variant ->
        final def copyTask = tasks.register("copy${variant.name.capitalize()}ApkToWww", CopyApkToWww) {
            it.apkDirectory.set(variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.APK.INSTANCE))
            it.builtArtifactsLoader.set(variant.artifacts.getBuiltArtifactsLoader())
            it.packageName.set(appPackageName)
            it.appVersionCode.set(appVersionCodeValue)
            it.buildTypeName.set(variant.buildType)
            it.destinationFolder.set(new File(rootProject.ext.destinationFolder))
        }
        tasks.matching { it.name == "assemble${variant.name.capitalize()}" }.configureEach {
            it.finalizedBy(copyTask)
        }
    }
}

// Custom tasks
preBuild.doLast {
    // save the combined build info into assets/build.info file
    def repo = org.ajoberstar.grgit.Grgit.open(dir: rootProject.rootDir)
    def result_line = "${repo.branch.current().getName()}-${repo.head().abbreviatedId} (${new Date().toString()})\n"
    def assetsDir = android.sourceSets.main.assets.srcDirs.toArray()[1]
    delete(assetsDir)
    mkdir(assetsDir)
    def buildInfoFile = new File(assetsDir, 'build.info').getAbsolutePath()
    new File(buildInfoFile).write(result_line)
    repo.close()
}

/**
 * Deletes apk and version from www apps directory
 */
clean.doLast {
    ant.delete() {
        fileset(dir: file("../../java/com.sap.sailing.www/apps"), includes: "$packageName*")
    }
}
